services:
  pi-work:
    image: pi-work:slim
    build:
      context: .
      args:
        BASE_IMAGE: ${BASE_IMAGE:-node:24-bookworm-slim}
    command: node_modules/.bin/next start -p 30141

    network_mode: host

    volumes:
      - ./volumes/pi_home:/root:rw

    restart: unless-stopped

    environment:
      HOME: /root
      NODE_ENV: production
      # host networking: keep the terminal WS off 30142 so a local dev
      # instance on the same host can run side by side
      PI_WORK_TERMINAL_PORT: 30145