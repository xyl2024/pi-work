services:
  pi-work:
    # Use the pre-built image (with playwright-cli manually installed) instead
    # of rebuilding from the upstream base. The CMD from that image is not
    # `next start`, so we set `command:` explicitly.
    image: playwright-cli-devenv:extended-piwork
    command: node_modules/.bin/next start -p 30141
    # build: omitted — we're using the existing image, not rebuilding

    network_mode: host

    volumes:
      - ./volumes/pi_home:/root:rw

    restart: unless-stopped

    environment:
      HOME: /root
      NODE_ENV: production