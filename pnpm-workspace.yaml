# pnpm settings live here (not in `.npmrc` / package.json) since pnpm 11.
# This file also makes the repo a single-package "workspace" so pnpm treats it
# as the settings home. `electron-shell/` is deliberately NOT a workspace
# member: it is a standalone Electron shell with its own dependency tree.

# Dependency build scripts are deny-by-default. Every dependency that ships an
# install/postinstall script has to be decided explicitly here:
#
#   - better-sqlite3 / node-pty: compile native addons against the local Node
#     ABI (see lib/server, instrumentation.ts);
#   - esbuild: resolves its platform binary for vite/vitest;
#   - sharp: verifies/links the prebuilt libvips binary used by next/image;
#   - protobufjs: its postinstall only regenerates .d.ts files we do not use;
#   - @google/genai / unrs-resolver: no build step needed, their platform
#     bindings come from optionalDependencies.
allowBuilds:
  better-sqlite3: true
  node-pty: true
  esbuild: true
  sharp: true
  protobufjs: false
  '@google/genai': false
  unrs-resolver: false

# `canvas` is deliberately never installed. It is only an *optional* peer of
# linkedom / jsdom / pdfjs-dist (server-side <canvas> rasterisation), none of
# which this app uses — but pnpm's autoInstallPeers would pull it in, and its
# native `canvas.node` binding then makes webpack choke ("Module parse failed")
# because the .pnpm path escapes Next's `node_modules/<pkg>` externals regex.
ignoredOptionalDependencies:
  - canvas

# linkedom / jsdom declare canvas as an optional peer; without ignoreMissing,
# autoInstallPeers would put it back.
peerDependencyRules:
  ignoreMissing:
    - canvas

# `@lobehub/icons` is only used for 30 deep imports in
# `components/ui/ProviderIcon.tsx`
# (`@lobehub/icons/es/<Provider>/components/Mono|Color`). Those components only
# pull in `react` and the package's own `../style` constants — they never touch
# `antd` or `@lobehub/ui`. But `@lobehub/icons` (and `antd-style`, its hard
# dependency) declare `antd` / `@lobehub/ui` as *required* peers, so pnpm's
# autoInstallPeers used to drag the whole antd + @lobehub/ui ecosystem in
# (@base-ui/react, @emoji-mart/data, @splinetool/runtime, several extra
# lucide-react copies, …): ~370 MB / ~460 packages that nothing at runtime
# ever loads. Marking those peers optional stops autoInstallPeers from
# installing them; the deep imports we actually use are unaffected. If the
# icons are ever imported from the `@lobehub/icons` root barrel, or the
# Avatar/Text components are used, this block has to be removed again.
packageExtensions:
  '@lobehub/icons':
    peerDependenciesMeta:
      '@lobehub/ui':
        optional: true
      antd:
        optional: true
  antd-style:
    peerDependenciesMeta:
      antd:
        optional: true

# eslint-config-next 16.2.1 declares `eslint-plugin-react-hooks: ^7.0.0`; the npm
# lockfile had frozen it at 7.0.1. 7.1.x promotes a batch of React Compiler
# diagnostics (preserve-manual-memoization, purity, static-components) from
# warnings/off to errors, which turns `pnpm run lint` from "10 pre-existing
# errors" into "34 errors" without any code change. Pin it back so the pnpm
# migration stays behaviour-neutral; drop this override in the same PR that
# fixes those 24 findings (they are real, just out of scope here).

overrides:
  eslint-plugin-react-hooks: 7.0.1

  # @lobehub/icons pins its optional lucide-react at ^0.469.0 while the app
  # itself depends on ^1.37.0, which pnpm resolves to two separate copies
  # (~37 MB extra). The 0.x copy is only referenced by @lobehub/icons'
  # `es/components` / `es/features` demo modules — none of which are on the
  # deep-import path used by components/ui/ProviderIcon.tsx. Force the
  # pre-1.0 consumers onto the same 1.x copy; our own `^1.37.0` is left alone
  # by the `<1` selector.
  'lucide-react@<1': 1.54.0
